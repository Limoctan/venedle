name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Update and deploy
        run: |
          cd /home/${{ secrets.SERVER_USER }}/venedle
          git pull
          docker compose -f compose.yaml -f compose.prod.yaml up --build -d
